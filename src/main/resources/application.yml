spring:
  application:
    name: iou
  datasource:
    # Local defaults match compose.yaml. In production set DATABASE_URL (see DEPLOY.md);
    # IouApplication translates it into these three properties.
    url: ${IOU_DB_URL:jdbc:postgresql://localhost:5432/iou}
    username: ${IOU_DB_USER:iou}
    password: ${IOU_DB_PASSWORD:iou}
    hikari:
      # Small pool, and idle connections are closed, so a serverless database
      # (Neon) is allowed to go to sleep when nobody is using the app.
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 600000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          # Browsers may keep the app's files but must check for a newer version each time,
          # so a new deploy reaches phones on the next open.
          no-cache: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml,application/manifest+json

iou:
  jwt:
    # HS256 signing key, at least 32 characters. Required when the "prod" profile is active.
    # Left empty elsewhere, a random key is generated at startup (logins end on restart).
    secret: ${IOU_JWT_SECRET:}
    # How long a login lasts. Long by default so family members sign in once per trip.
    ttl: ${IOU_JWT_TTL:P60D}
