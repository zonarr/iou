# Used only while the Docker image is built: starts the application without a database so
# the JVM can record which classes it loads (class data sharing), then exits.
# Never use this profile to run the app.
spring:
  flyway:
    enabled: false
  datasource:
    hikari:
      # Do not try to connect at startup.
      initialization-fail-timeout: -1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
