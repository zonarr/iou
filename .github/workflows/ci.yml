name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The wrapper downloads Maven itself on first use; retry so a network blip does not fail the build.
      - name: Download Maven (with retries)
        env:
          MVNW_VERBOSE: 'true'
        run: |
          for attempt in 1 2 3 4; do
            ./mvnw -B --version && exit 0
            echo "Attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1

      # Unit tests, then integration tests against a real PostgreSQL 16 started by
      # Testcontainers (Docker is preinstalled on GitHub's Ubuntu runners).
      - name: Build, unit tests and integration tests
        run: ./mvnw -B verify

      - name: Check translations (English and Thai have the same keys)
        run: node e2e/check-i18n.mjs

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
